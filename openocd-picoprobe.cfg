# Pico running Raspberry Pi debugprobe_on_pico.uf2 (CMSIS-DAP).
# This is not the obsolete, proprietary picoprobe adapter protocol.
# This file configures the adapter/target only: no init, erase, unlock or program.
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 100
source [find target/stm32f0x.cfg]
# Normal three-wire SWD connection; use Cortex-M system reset without NRST.
reset_config none
